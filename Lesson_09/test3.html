<!DOCTYPE html>
<html>
<head>
    <title>Test3</title>
<style>
    p.one {
        border: solid #99ff65;
        border-width: 5px 20px; /* 5px top and bottom, 20px on the sides */
    }

    p.two {
        border: solid #65a5ff;
        border-width: 20px 5px; /* 20px top and bottom, 5px on the sides */
    }

    p.three {
        border: solid #ff65bf;
        border-width: 25px 10px 4px 35px; /* 25px top, 10px right, 4px bottom and 35px left */
    }
</style>
</head>
<body>

<h2>The border-width Property</h2>

<p class="one">This is a Border</p>
<p class="two">This is a Border</p>
<p class="three">This is a Border</p>

</body>
</html>
