<!DOCTYPE html>
<html>
<head>
    <title>Test8</title>
<style>
    .p1 {
        border: 2px solid blue;
    }
    .p2 {
        border: 2px dashed blue;
    }
    .p3 {
        border: 2px dotted blue;
    }
    .p4 {
        border: 2px groove blue;
    }
    .p5 {
        border-top: 2px solid red;
    }
    .p6 {
        border-right: 2px solid red;
    }
    .p7 {
        border-bottom: 2px solid red;
    }
    .p8 {
        border-left: 2px solid red;
    }
</style>
</head>

<body>

    <h2>CSS Shorthand Border Property</h2>
    <p class="p1">This is a Border</p>
    <p class="p2">This is a Border</p>
    <p class="p3">This is a Border</p>
    <p class="p4">This is a Border</p>
    <p class="p5">This is a Border</p>
    <p class="p6">This is a Border</p>
    <p class="p7">This is a Border</p>
    <p class="p8">This is a Border</p>
</body>
</html>
