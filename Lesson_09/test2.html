<!DOCTYPE html>
<html>
<head>
    <title>Test2</title>

    <style>

        .p1 {
            border: 10px dotted;
            border-width: 5px;
        }
        .p2 {
            border: 10px dashed;
            border-width: medium;
        }
        .p3 {
            border: 10px solid #e24949;
        }
        .p4 {
            border: 10px double blue;
            border-width: inherit;
        }
        .p5 {
            border: 10px groove rgb(118, 223, 241);
            border-width:initial;
        }
        .p6 {
            border: 10px ridge #4977e2;
            border-width:thick;
        }
        .p7 {
            border: 10px inset #67f857;
            border-width:thin;
        }
        .p8 {
            border: 10px outset #ff57bf;
            border-width:unset;
        }
    </style>
</head>

<body>

    <p class="p1">This is Dotted Border</p>
    <p class="p2">This is Dashed Border</p>
    <p class="p3">This is Solid Border</p>
    <p class="p4">This is Double Border</p>
    <p class="p5">This is Groove Border</p>
    <p class="p6">This is Ridge Border</p>
    <p class="p7">This is Inset Border</p>
    <p class="p8">This is Outset Border</p>

</body>
</html>
