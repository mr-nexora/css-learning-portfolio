<!DOCTYPE html>
<html>
<head>
    <title>Test4</title>

    <style>
        .p1 {
            border: 10px dotted;
            border-color: #e24949;
        }
        .p2 {
            border: 10px dashed;
            border-color: rgb(26, 255, 118);
        }
        .p3 {
            border: 10px solid;
            border-color: #e9ff45;
        }
        .p4 {
            border: 10px double ;
            border-color: blue;
        }
        .p5 {
            border: 10px groove ;
            border-color: rgb(118, 223, 241);
        }
        .p6 {
            border: 10px ridge ;
            border-color: #4977e2;
        }
        .p7 {
            border: 10px inset ;
            border-color: #67f857;
        }
        .p8 {
            border: 10px outset ;
            border-color: #ff57bf;
        }

    </style>
</head>

<body>

    <h2>CSS Border Color</h2>

    <p class="p1">This is Dotted Border</p>
    <p class="p2">This is Dashed Border</p>
    <p class="p3">This is Solid Border</p>
    <p class="p4">This is Double Border</p>
    <p class="p5">This is Groove Border</p>
    <p class="p6">This is Ridge Border</p>
    <p class="p7">This is Inset Border</p>
    <p class="p8">This is Outset Border</p>


</body>
</html>
