<!DOCTYPE html>
<html>
<head>
    <title>Test3</title>

<style>
    p {
       padding:10px;
    }
    .p1 {
        outline-style: dotted;
        outline-color:black;
    }
    .p2 {
        outline-style: dashed;
        outline-color: red;
    }
    .p3 {
        outline-style: double ;
        outline-color: #10a352;
    }
    .p4 {
        outline-style: groove ;
        outline-color: hsl(233, 82%, 35%);
    }
    .p5 {
        outline-style:auto ;
        outline-color: hwb(327 6% 36%);
    }
    .p6 {
        outline-style: ridge ;
        outline-color: antiquewhite;
    }
    .p7 {
        outline-style: outset  ;
        outline-color: chartreuse;
    }

</style>
</head>
<body>

    <h2> CSS Outline Color</h2>
    <p class="p1">This is a Outline</p>
    <p class="p2">This is a Outline</p>
    <p class="p3">This is a Outline</p>
    <p class="p4">This is a Outline</p>
    <p class="p5">This is a Outline</p>
    <p class="p6">This is a Outline</p>
    <p class="p7">This is a Outline</p>

</body>
</html>
