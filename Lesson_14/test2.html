<!DOCTYPE html>
<html>
<head>
    <title>Test2</title>

<style>
    p {
        padding: 5px;
        outline-style: solid;
        outline-color: green;
    }

    .p1 {
        outline-width: thin;
    }

    .p2 {
        outline-width: medium;
    }

    .p3 {
        outline-width: thick;
    }

    .p4 {
        outline-width: 8px;
    }

</style>
</head>
<body>

    <h2> CSS Outline Width</h2>
    <p class="p1">This is a Outline</p>
    <p class="p2">This is a Outline</p>
    <p class="p3">This is a Outline</p>
    <p class="p4">This is a Outline</p>

</body>
</html>
