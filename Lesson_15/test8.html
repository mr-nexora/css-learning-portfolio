<!DOCTYPE html>
<html>
<head>
    <title>Test7</title>
<style>
    p {
        font-size: 25px;
    }
    .p1 {
        text-decoration-line:none ;
        text-decoration-color: brown;
    }
    .p2 {
        text-decoration-line: underline ;
        text-decoration-color: rgb(42, 165, 81);
    }
    .p3 {
        text-decoration-line:overline ;
        text-decoration-color: rgb(45, 198, 190);
    }
    .p4 {
        text-decoration-line:overline underline ;
        text-decoration-color: rgb(241, 247, 50);
    }
    .p5 {
        text-decoration-line:line-through ;
        text-decoration-color: rgb(255, 49, 49);
    }
</style>
</head>

<body>

    <h2>Text-decoration-color</h2>

    <p class="p1">This is a Text</p>
    <p class="p2">This is a Text</p>
    <p class="p3">This is a Text</p>
    <p class="p4">This is a Text</p>
    <p class="p5">This is a Text</p>

</body>
</html>
