<!DOCTYPE html>
<html>
<head>
    <title>Test1</title>
<style>
    p {
        font-size: 40px;
    }    
    .p1 {
        text-shadow: 2px 2px;
    }
    .p2 {
        text-shadow: 2px 2px red;
    }
    .p3 {
        text-shadow: 2px 2px 5px red;
    }
    .p4 {
        text-shadow: 2px 2px 4px #000000;
    }
    .p5 {
        text-shadow: 0 0 3px #ff0000;
    }
    .p6 {
        text-shadow: 0 0 3px #ff0000, 0 0 5px #0000ff;
    }
    .p7 {
        text-shadow: 1px 1px 2px black, 0 0 25px blue, 0 0 5px red;
    }
</style>
</head>

<body>

    <h2>CSS Text Shadow</h2>
    <p class="p1">This is a sample Text</p>
    <p class="p2">This is a sample Text</p>
    <p class="p3">This is a sample Text</p>
    <p class="p4">This is a sample Text</p>
    <p class="p5">This is a sample Text</p>
    <p class="p6">This is a sample Text</p>
    <p class="p7">This is a sample Text</p>

</body>
</html>
