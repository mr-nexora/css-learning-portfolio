<!DOCTYPE html>
<html>
<head>
    <title>Test4</title>
<style>
    p {
        font-size: 25px;
    }
    .p1 {
        text-align-last:auto;
    }
    .p2 {
        text-align-last:center;
    }
    .p3 {
        text-align-last:justify;
    }
    .p4 {
        text-align-last:left;
    }
    .p5 {
        text-align-last:right;
    }
    .p6 {
        text-align-last:start;
    }
    .p7 {
        text-align-last:end;
    }
</style>
</head>

<body>

    <h2>Text Align Last</h2>

    <p class="p1">This is a sample Text</p>
    <p class="p2">This is a sample Text</p>
    <p class="p3">This is a sample Text</p>
    <p class="p4">This is a sample Text</p>
    <p class="p5">This is a sample Text</p>
    <p class="p6">This is a sample Text</p>
    <p class="p7">This is a sample Text</p>

</body>
</html>
