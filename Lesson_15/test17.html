<!DOCTYPE html>
<html>
<head>
    <title>Test1</title>
<style>
    p {
        font-size: 25px;
    }
    .p1 {
        white-space:normal;
    }
    .p2 {
        white-space:nowrap;
    }
    .p3 {
        white-space:pre;
    }
    .p4 {
        white-space:pre-line;
    }
    .p5 {
        white-space:pre-wrap;
    }
</style>
</head>

<body>

    <h2>White-space</h2>
    <p class="p1">This is a sample Text</p>
    <p class="p2">This is a sample Text</p>
    <p class="p3">This is a sample Text</p>
    <p class="p4">This is a sample Text</p>
    <p class="p5">This is a sample Text</p>
     
</body>
</html>
